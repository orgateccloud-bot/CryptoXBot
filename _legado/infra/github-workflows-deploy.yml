name: Deploy to GCP

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: string

env:
  GCP_PROJECT_ID: rich-streamer-v4p9v
  GCP_REGION: us-central1
  GAR_REPO: botbinance
  SERVICE_NAME: botbinance-prod
  INSTANCE_NAME: botbinance-vm

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: projects/${{ env.GCP_PROJECT_ID }}/locations/global/workloadIdentityPools/github-actions/providers/github-actions
        service_account: github-actions-deployer@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker
      run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

    - name: Build Docker image
      run: |
        docker build \
          --target production \
          --tag ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/botbinance:${{ github.sha }} \
          --tag ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/botbinance:latest \
          .

    - name: Push Docker image
      run: |
        docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/botbinance:${{ github.sha }}
        docker push ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/botbinance:latest

    - name: Deploy to Compute Engine
      run: |
        gcloud compute instances update-container ${{ env.INSTANCE_NAME }} \
          --container-image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/botbinance:${{ github.sha }} \
          --container-env-file .env.prod \
          --container-restart-policy always \
          --zone ${{ env.GCP_REGION }}-a

    - name: Verify deployment
      run: |
        # Aguardar health check
        sleep 60

        # Verificar se container está rodando
        gcloud compute ssh ${{ env.INSTANCE_NAME }} \
          --zone ${{ env.GCP_REGION }}-a \
          --command "docker ps | grep botbinance" \
          --ssh-flag="-o ConnectTimeout=10"

    - name: Run smoke tests
      run: |
        # Testes básicos de saúde
        gcloud compute ssh ${{ env.INSTANCE_NAME }} \
          --zone ${{ env.GCP_REGION }}-a \
          --command "
            # Verificar se aplicação responde
            curl -f http://localhost:8000/health || exit 1

            # Verificar logs por erros críticos
            docker logs botbinance-prod 2>&1 | grep -i error | head -5 || true
          "

    - name: Notify deployment success
      if: success()
      run: |
        echo "✅ Deployment successful to ${{ env.GCP_PROJECT_ID }}"
        echo "Image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/botbinance:${{ github.sha }}"

    - name: Notify deployment failure
      if: failure()
      run: |
        echo "❌ Deployment failed"
        # Aqui poderia integrar com Slack, Discord, etc.