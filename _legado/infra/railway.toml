# Railway configuration — BinanceXBot
#
# DOIS SERVIÇOS no mesmo repositório:
#   worker    → main.py   (bot de trading + WebSocket)
#   dashboard → dashboard.py (painel Flask + APIs REST)
#
# Para criar: Railway → New Project → Deploy from GitHub repo → CryptoXBot
#   1. Service "worker":    usa este arquivo como está
#   2. Service "dashboard": New Service → mesmo repo → sobrescreva Start Command
#      para: python dashboard.py

[build]
builder = "nixpacks"

# ── Serviço WORKER (padrão) ──────────────────────────────────────────────────
[deploy]
startCommand = "python main.py --simulacao --intervalo 15"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 30

# Variáveis mínimas obrigatórias (defina no painel Railway):
#   DATABASE_URL        → postgres://... (de Supabase)
#   DATABASE_BACKEND    → postgres
#   BINANCE_API_KEY     → (via Railway Variables)
#   BINANCE_API_SECRET  → (via Railway Variables)
#   TELEGRAM_BOT_TOKEN  → (opcional)
#   TELEGRAM_CHAT_ID    → (opcional)
#   ENV                 → production
#   CORS_ORIGINS        → https://seu-dashboard.up.railway.app

# ── Serviço DASHBOARD ────────────────────────────────────────────────────────
# Para configurar, no painel Railway sobrescreva o Start Command para:
#   python dashboard.py
#
# O dashboard roda na porta injetada por $PORT (Railway injeta automaticamente).
# Gere um domínio público em Settings → Networking para acesso externo.
#
# Variáveis adicionais para o dashboard:
#   SERVICE_ROLE → dashboard
#   SECRET_KEY   → (gere com: python -c "import secrets; print(secrets.token_hex(32))")
