version: '3.8'

services:
  # BotBinance HFT - Produção Otimizada
  botbinance:
    image: ${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/botbinance/botbinance:latest
    container_name: botbinance-prod
    restart: always

    # Configurações de segurança para produção
    privileged: false
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    read_only: true

    # Limitação de recursos para estabilidade
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Variáveis de ambiente de produção
    environment:
      - PYTHONPATH=/app
      - ENV=production
      - LOG_LEVEL=INFO
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - REDIS_URL=redis://redis:6379
      - DRY_RUN=false

    # Volumes temporários apenas (read-only para código)
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    volumes:
      - data:/app/data:rw
      - logs:/app/logs:rw

    # Rede isolada
    networks:
      - prod-network

    # Health check rigoroso
    healthcheck:
      test: [ "CMD", "python", "-c", "import asyncio; print('OK')" ]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s

    # Porta para métricas (acesso interno apenas)
    expose:
      - "8000"

    # Logging estruturado para GCP
    logging:
      driver: "gcplogs"
      options:
        gcp-project: "${GCP_PROJECT_ID}"
        gcp-log-cmd: "true"

  # Redis para cache/state
  redis:
    image: redis:7-alpine
    container_name: botbinance-redis-prod
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --protected-mode yes
    networks:
      - prod-network
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

networks:
  prod-network:
    driver: bridge
    internal: true # Rede isolada, sem acesso externo

volumes:
  data:
    driver: local
  logs:
    driver: local
  redis_data:
    driver: local
