[pytest]
# Coleta apenas a suíte de produção. O código arquivado em _legado/ não é
# coletado (seus imports internos apontam para módulos que voltam ao lugar só
# em caso de rollback — ver _legado/LEIA-ME.md).
testpaths = tests
norecursedirs = _legado .git .venv venv build dist node_modules __pycache__
# -p no:logfire: maquinas de dev compartilhadas com outros projetos podem ter
# o pacote logfire instalado globalmente; seu plugin pytest11 quebra a coleta
# quando ha incompatibilidade de versao com opentelemetry-sdk. Este projeto
# nao usa logfire, entao o plugin e desabilitado explicitamente.
addopts = -p no:logfire
