# BotBinance — Nginx reverse proxy para o Dashboard
# Salvar em: /etc/nginx/sites-available/botbinance
# Ativar:    sudo ln -s /etc/nginx/sites-available/botbinance /etc/nginx/sites-enabled/
#            sudo systemctl restart nginx

server {
    listen 80;
    server_name _;   # aceita qualquer domínio/IP

    # Logs
    access_log /var/log/nginx/botbinance_access.log;
    error_log  /var/log/nginx/botbinance_error.log;

    # Proxy para o Flask/SocketIO na porta 5000
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Headers necessários para WebSocket / SocketIO
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout  3600;
        proxy_send_timeout  3600;
    }

    # Socket.IO específico
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout  3600;
    }
}
