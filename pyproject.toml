[tool.black]
line-length = 100
# M-1: `.claude/worktrees/` guarda CÓPIAS do próprio repo em estados antigos
# (sessões paralelas) — eram 1.966 dos 2.147 achados do flake8. `_legado/` é
# código aposentado. Nenhum dos dois deve gatear o CI.
extend-exclude = '''(?x)
  ^/(_legado|\.claude|\.venv|scratch_vbt)/
'''
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
# M-1: mesmo motivo do .flake8 — codigo aposentado nao gateia o CI.
skip_glob = ["_legado/*", ".venv/*", ".claude/*"]

# flake8 nao suporta config em pyproject.toml - ver .flake8 na raiz

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["venv", ".venv"]
