version: "3.9"

# BinanceXBot — dois serviços, mesma imagem, configuração por variável.
# Uso:
#   cp .env.example .env   # preencher credenciais
#   docker compose up -d
#   docker compose logs -f worker
#
# Modo real (quando pronto):
#   Editar .env: DRY_RUN=false, ALLOW_REAL_TRADING=true, ENV=production

services:
  worker:
    build: .
    container_name: bxbot-worker
    command: python main.py --simulacao --intervalo 15
    env_file: .env
    environment:
      - PORT=8080
      - ENABLE_HEALTH_SERVER=true
      - SERVICE_ROLE=worker
    volumes:
      - ./data:/app/data
    restart: on-failure:10
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build: .
    container_name: bxbot-dashboard
    command: python dashboard.py
    env_file: .env
    environment:
      - PORT=5000
      - SERVICE_ROLE=dashboard
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    restart: on-failure:10
    depends_on:
      - worker
