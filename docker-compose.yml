version: '3.8'

services:
  # BotBinance HFT - Serviço principal otimizado
  botbinance:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: botbinance-hft
    restart: unless-stopped

    # Configurações para baixa latência HFT
    privileged: true
    cap_add:
      - SYS_NICE
    security_opt:
      - no-new-privileges:true

    # Recursos dedicados para HFT
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Variáveis de ambiente
    environment:
      - PYTHONPATH=/app
      - LOG_LEVEL=INFO
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      - REDIS_URL=${REDIS_URL}
      - DRY_RUN=true

    # Volumes para persistência
    volumes:
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
      - ./config:/app/config:ro

    # Rede dedicada para baixa latência
    networks:
      - hft-network

    # Health check
    healthcheck:
      test: [ "CMD", "python", "-c", "print('HFT OK')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Expor porta para métricas Prometheus
    ports:
      - "8000:8000"

    # Logging otimizado
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis para cache/state (opcional para HFT)
  redis:
    image: redis:7-alpine
    container_name: botbinance-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - hft-network
    volumes:
      - redis_data:/data
    profiles:
      - with-redis

  # Monitoring com Prometheus (opcional)
  prometheus:
    image: prom/prometheus:latest
    container_name: botbinance-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - hft-network
    profiles:
      - monitoring

  # Grafana para dashboards (opcional)
  grafana:
    image: grafana/grafana:latest
    container_name: botbinance-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - hft-network
    profiles:
      - monitoring

networks:
  hft-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: hft-bridge

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
