name: CI - BinanceXBot

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install black flake8 isort mypy bandit

      - name: Run Black (code formatter)
        run: black --check --diff .

      - name: Run isort (import sorting)
        run: isort --check-only --diff .

      - name: Run Flake8 (linter)
        # M-1: eram 2.170 achados com `|| true` e um comentário dizendo "132
        # pre-existentes". 1.966 deles estavam em `.claude/worktrees/` — CÓPIAS
        # do próprio repo em estados antigos, criadas por sessões paralelas: o
        # CI estava lintando o passado do projeto. Excluído esse diretório (e
        # `_legado/`, `.venv/`, `scratch_vbt/`, `config/settings.py`), sobraram
        # 139 no código vivo, e esses 139 foram a zero.
        #
        # SEM `|| true`: qualquer achado novo reprova o pipeline. Voltar a
        # colocá-lo é reabrir o mecanismo que deixou o débito chegar a 2.170
        # sem ninguém perceber.
        run: flake8 . --count --statistics --show-source

      - name: Run MyPy (type checking)
        run: mypy . --ignore-missing-imports || true

      - name: Run Bandit (security check)
        run: bandit -r . -ll || true

  test:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Smoke test - imports principais
        # Gate rapido: falha cedo e com mensagem clara se a cadeia de import do
        # bot quebrar (ex.: modulo data/ ausente, helper de score indefinido).
        run: |
          python -c "import main"
          python -c "import score"
          python -c "import estrategias.otimizada"
          python -c "import database"

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml --cov-report=html -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety

      - name: Run pip-audit
        run: pip-audit --desc

      - name: Run Safety check
        run: safety check --json || true

  # Deploy é via systemd na VPS (deploy/setup.sh) — sem build de imagem Docker.
  # Os artefatos Docker/GCP/Railway foram arquivados em _legado/infra/.

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, security]

    steps:
      - name: Check workflow status
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ Pipeline failed!"
            exit 1
          else
            echo "✅ Pipeline passed!"
          fi
