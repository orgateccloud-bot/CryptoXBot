name: CI - BinanceXBot

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  lint:
    name: Linting & Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install black flake8 isort mypy bandit

      - name: Run Black (code formatter)
        run: black --check --diff .

      - name: Run isort (import sorting)
        run: isort --check-only --diff .

      - name: Run Flake8 (linter)
        # M-1: eram 2.170 achados. 1.966 deles estavam em `.claude/worktrees/`
        # — CÓPIAS do próprio repo em estados antigos, criadas por sessões
        # paralelas. O CI estava lintando o passado do projeto. Com esse
        # diretório e `_legado/` excluídos (ver .flake8), sobraram 139 no
        # código vivo.
        #
        # `|| true` fica ATÉ esses 139 chegarem a zero. Torná-lo bloqueante
        # agora quebraria o pipeline em débito pré-existente, não em regressão.
        # O gate real de estilo é o black + isort logo acima, que passam e
        # BLOQUEIAM.
        run: flake8 . --count --statistics --show-source || true

      - name: Flake8 nao pode PIORAR (teto de regressao)
        # Trava de regressão enquanto o débito não zera: o número pode cair,
        # nunca subir. Sem isto, `|| true` acima deixaria o débito crescer sem
        # limite — que foi exatamente como ele chegou a 2.170.
        #
        # `|| true` dentro do $( ): o runner roda com `-eo pipefail`, e flake8
        # sai 1 quando acha algo. Sem a guarda, o passo morreria aqui em vez de
        # comparar o número.
        run: |
          N=$( (flake8 . --count -q || true) | tail -1 )
          echo "flake8: $N achados no codigo vivo (teto atual: $FLAKE8_TETO)"
          if [ "$N" -gt "$FLAKE8_TETO" ]; then
            echo "::error::flake8 subiu de $FLAKE8_TETO para $N. Corrija os novos achados."
            exit 1
          fi
          if [ "$N" -lt "$FLAKE8_TETO" ]; then
            echo "::notice::flake8 caiu para $N — abaixe FLAKE8_TETO no ci.yml."
          fi
        env:
          # Débito herdado, medido em 2026-08-11 (54 E501, 19 E402, 17 F401,
          # 14 F541, 12 E741, 10 E231, 8 F841, 5 diversos). Este número só pode
          # DESCER. Quando chegar a 0, remover o `|| true` do passo acima e
          # apagar este.
          FLAKE8_TETO: 139

      - name: Run MyPy (type checking)
        run: mypy . --ignore-missing-imports || true

      - name: Run Bandit (security check)
        run: bandit -r . -ll || true

  test:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Smoke test - imports principais
        # Gate rapido: falha cedo e com mensagem clara se a cadeia de import do
        # bot quebrar (ex.: modulo data/ ausente, helper de score indefinido).
        run: |
          python -c "import main"
          python -c "import score"
          python -c "import estrategias.otimizada"
          python -c "import database"

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml --cov-report=html -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit safety

      - name: Run pip-audit
        run: pip-audit --desc

      - name: Run Safety check
        run: safety check --json || true

  # Deploy é via systemd na VPS (deploy/setup.sh) — sem build de imagem Docker.
  # Os artefatos Docker/GCP/Railway foram arquivados em _legado/infra/.

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, security]

    steps:
      - name: Check workflow status
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.test.result }}" == "failure" ]]; then
            echo "❌ Pipeline failed!"
            exit 1
          else
            echo "✅ Pipeline passed!"
          fi
