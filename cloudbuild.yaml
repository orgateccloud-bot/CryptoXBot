steps:
  # Build da imagem Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--target=production'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/botbinance/botbinance:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/botbinance/botbinance:latest'
      - '.'

  # Push para Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/botbinance/botbinance:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/botbinance/botbinance:latest'

  # Deploy no Compute Engine
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'compute'
      - 'instances'
      - 'update-container'
      - 'botbinance-vm'
      - '--container-image=us-central1-docker.pkg.dev/$PROJECT_ID/botbinance/botbinance:$COMMIT_SHA'
      - '--container-env-file=.env.prod'
      - '--container-restart-policy=always'
      - '--zone=us-central1-a'

  # Verificação pós-deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'compute'
      - 'ssh'
      - 'botbinance-vm'
      - '--zone=us-central1-a'
      - '--command=docker ps | grep botbinance'
      - '--ssh-flag=-o ConnectTimeout=10'

timeout: '1200s'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'